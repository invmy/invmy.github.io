name: Deploy Astro site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 使用官方标准的 Node.js 环境（满足 Astro >=22.23.4 的硬性要求）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 2. 使用 npm 安装依赖，加入 --legacy-peer-deps 解决插件与 Astro 7 的版本冲突
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 3. 使用标准 npx 运行 Astro 构建
      - name: Build with Astro
        run: |
          EXTRACTED_REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          PUBLIC_GITHUB_REPO_NAME="$EXTRACTED_REPO_NAME" npx astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        env:
          SECRET_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          PUBLIC_GITHUB_REPO_ID: ${{ github.event.repository.node_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5